<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Todo App</title>
        <link 
        href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
        rel="stylesheet"
        >
        <link 
        rel="stylesheet" 
        href="style.css" 
        media="screen" 
        >
    </head>
    <body>
        <aside class="aaa">
            <h1>The Eisenhower Matrix table</h1>
            <img src="./eisenhower-matrix.jpg" alt="The Eisenhower Matrix table">
            <a 
            class="more-inf" 
            href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
        </aside>
        <article class="centered-main-page-element">
            <h2>Adding Items using the Eisenhower Matrix table</h2>
            <section id="top-section-for-adding-element-to-list">
                <h4>topSectionForAddingElementToList</h4>
                <label for="new-task">Add Item</label>
                <div class="task-row-wrapper">
                    <input 
                    id="new-task"
                    class="task" 
                    type="text">
                    <button>Add</button>
                </div>
            </section>
            <section>
                <h3>Todo</h3>
                <ul id="incomplete-tasks">
                    <li>
                        <input type="checkbox">
                        <label class="task">Pay Bills</label>
                        <input type="text" class="task">
                        <button class="edit">Edit</button>
                        <button class="delete">
                            <img src="./remove.svg" alt="Button icon">
                        </button>
                    </li>
                    <li class="edit-mode">
                        <input type="checkbox">
                        <label class="task">Go Shopping</label>
                        <input 
                        type="text" 
                        value="Go Shopping" 
                        class="task">
                        <button class="edit">Save</button>
                        <button class="delete">
                            <img src="./remove.svg" alt="Button icon">
                        </button>
                    </li>
                </ul>
            </section>
            <section>
                <h3>Completed</h3>
                <ul id="completed-tasks">
                    <li>
                        <input type="checkbox" checked>
                        <label class="task">See the Doctor</label>
                        <input type="text" class="task">
                        <button class="edit">Edit</button>
                        <button class="delete">
                            <img src="./remove.svg" alt="Button icon">
                        </button>
                    </li>
                </ul>
            </section>
        </article>
        <script src="app.js"></script>
    </body>
</html>
