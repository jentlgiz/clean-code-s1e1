<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Todo App</title>
        <link 
        href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
        rel="stylesheet"
        >
        <link 
        rel="stylesheet" 
        href="style.css" 
        media="screen" 
        >
    </head>
    <body>
        <header class="aaa">
            <img src="./eisenhower-matrix.jpg" alt="The Eisenhower Matrix table">
            <a 
            class="more-info" 
            href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
            <h1>Eisenhower Matrix Table</h1>
        </header>
        <main class="centered-main-page-element">
            <section id="topSectionForAddingElementToList">
                <h2>Adding Item Section</h2>
                <label for="new-task">Add Item</label>
                <div class="task-row-wrapper">
                    <input 
                    id="new-task"
                    class="task" 
                    type="text">
                    <button>Add</button>
                </div>
            </section>
            <article>
                <h3>Todo</h3>
                <nav>
                    <ul id="incompleteTasks">
                        <li>
                            <input type="checkbox">
                            <label class="task">Pay Bills</label>
                            <input type="text" class="task">
                            <button class="edit">Edit</button>
                            <button class="delete">
                                <img src="./remove.svg" alt="Button icon">
                            </button>
                        </li>
                        <li class="editMode">
                            <input type="checkbox">
                            <label class="task">Go Shopping</label>
                            <input 
                            type="text" 
                            value="Go Shopping" 
                            class="task">
                            <button class="edit">Save</button>
                            <button class="delete">
                                <img src="./remove.svg" alt="Button icon">
                            </button>
                        </li>
                    </ul>
                </nav>
            </article>
            <aside>
                <h3>Completed</h3>
                <nav>
                    <ul id="completed-tasks">
                        <li>
                            <input type="checkbox" checked>
                            <label class="task">See the Doctor</label>
                            <input type="text" class="task">
                            <button class="edit">Edit</button>
                            <button class="delete">
                                <img src="./remove.svg" alt="Button icon">
                            </button>
                        </li>
                    </ul>
                </nav>
            </aside>
        </main>
        <script src="app.js"></script>
    </body>
</html>
